# The test suite, on every push and pull request.
#
# Until this existed the only workflow in the repository was the Windows
# build, which fires on workflow_dispatch and version tags — so a branch
# could be opened, reviewed and merged without anything ever running the
# tests. They are fast (a few seconds) and need no services, so there is no
# reason for them not to gate a merge.
#
# Both supported interpreters are covered: pyproject declares
# requires-python >= 3.11 and classifies 3.11 and 3.12.
name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

# A new push supersedes whatever was still running for the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # The base install only. crawl4ai and browser-use are optional extras
        # that pull a browser and a few hundred MB between them; the crawler
        # tests cover the "not installed" path deliberately, which is the
        # path most users are on.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
