# OpenVZ Leads configuration.
#
# Three ways to fill this in, easiest first:
#   openvz-leads target "dental clinics in California, 5-50 staff"
#                                    — writes the `icp:` block from a sentence
#   openvz-leads train https://your-site.com
#                                    — writes the `product:` block from your site
#   openvz-leads setup               — asks you, one question at a time

# Who the outreach comes from. Use a real person at a real company —
# false identities are both illegal in most jurisdictions and the fastest
# way to get a sending domain blacklisted.
persona:
  name: "Your Name"
  company: "Your Company"
  role: "Business Development"
  email: "you@yourcompany.com"
  linkedin: "linkedin.com/in/your-profile"
  tone: "professional, consultative, confident"

product:
  name: "Your Product"
  description: "Describe what your product does and who it's for"
  pricing: "Starting at $X/mo"
  key_benefits:
    - "Benefit 1"
    - "Benefit 2"
    - "Benefit 3"
  objection_responses:
    "too expensive": "I understand budget is important. Most of our clients see ROI within 30 days..."
    "already have a solution": "That makes sense. Curious — what's the one thing you wish it did better?"
    "not interested": "No worries at all. Mind if I ask what your current approach looks like?"
  offer:
    primary: ""                    # Main offer (e.g. "Monthly subscription from $99/mo")
    entry: ""                      # Low-commitment entry (free trial, free audit…)
    goal: "book_call"              # book_call, start_trial, get_reply
    booking_method: "calendar_link" # calendar_link, suggest_times, ask_preference
    booking_url: ""
    meeting_duration: "15 minutes"
    meeting_owner: ""

# Who you want to reach. The Scout searches against this, and the Profiler
# scores every account against it.
#
# You do not have to write this by hand:
#   openvz-leads target "find dental clinics in California with 5-50 staff"
# parses a sentence into these fields, shows you what it inferred that you
# never said, and writes the block back — comments and all.
icp:
  industries:
    - "SaaS"
    - "Marketing Agency"
  company_size: "10-200 employees"
  titles:
    - "VP Marketing"
    - "Head of Growth"
    - "CMO"
    - "Director of Marketing"
  geography:
    - "United States"
  # Traits that are none of the four fields above — "outdated website",
  # "recently funded", "hiring engineers". No search engine can filter on
  # these, so they do two things instead: loosen the search queries, and
  # become criteria the account analysis is told to check against evidence
  # (confirmed / contradicted / unknown) rather than assume.
  keywords: []
  # What rules an account out. Checked during analysis: an account the
  # evidence shows matching one of these is scored 1-3 with the reason.
  exclusions: []
  # The sentence the block above was parsed from, kept verbatim. Written by
  # `openvz-leads target`; the only record of what was actually asked for
  # once someone hand-edits the fields.
  request: ""

# ── Human review ──────────────────────────────────────────────────────
# The safety rail. With require_approval on (the default), campaigns stop
# in the review queue and nothing is sent until you approve it — in the
# dashboard, or with `openvz-leads review approve <id>`.
review:
  require_approval: true
  auto_reply: false      # classify replies, but never answer them unattended

# ── Account analysis ──────────────────────────────────────────────────
# The Profiler spends one Claude call per account to produce a brief:
# what they do, why they fit, buying signals, decision chain, how to open.
profiling:
  enabled: true
  min_score: 5           # skip accounts the Scout scored below this
  max_per_cycle: 5       # analyses per heartbeat — controls Claude spend
  output_language: "English"   # e.g. "简体中文", "日本語". Emails keep their own language.
  fetch_website: true    # pull the company's own site as evidence

# ── Channels ──────────────────────────────────────────────────────────
# provider: "none" is draft-only — everything runs, nothing is sent, and
# you take the results out with `openvz-leads export`.
#
#   none       draft only (default)
#   gmail      send from your own mailbox. Threads properly, replies land in
#              your inbox, no third party holds the list. In exchange you own
#              the deliverability: a personal mailbox that suddenly sends 50
#              cold emails a day is a mailbox Google will limit. Keep
#              max_daily_sends low and raise it slowly.
#   instantly  a sending platform. It warms domains and rotates inboxes,
#              and it holds your prospect list.
channels:
  email:
    enabled: true
    provider: "none"
    # Counts follow-ups, not just first contacts. On the Gmail path this is
    # the number that keeps a real mailbox out of trouble; 50 is already
    # brisk for a new sending address.
    max_daily_sends: 50

    # Only read when provider is "gmail".
    gmail:
      sender_name: ""          # blank = persona.name

      # What the mailbox may be read for.
      #   metadata  headers only — enough to see that they replied and stop
      #             the follow-ups, without this tool ever holding the text
      #             of someone's reply. The default, and enough for most.
      #   readonly  bodies too, so replies can be classified and (if you
      #             turn auto_reply on) answered. Broader; opt in knowingly.
      #   none      send only. Follow-ups could not be stopped, so this is
      #             rejected at startup unless max_followups is 0.
      read_scope: "metadata"

      # However long a sequence the Writer produced, send at most this many
      # follow-ups after the first email, no closer together than this.
      max_followups: 2
      min_followup_days: 2

      # The opt-out and the postal address.
      #
      # Instantly appended these for us. Gmail does not — it is a mailbox,
      # not a sending platform — so this is the only thing between you and
      # an unlawful commercial email. CAN-SPAM, PECR and most equivalents
      # require a working opt-out mechanism and a real postal address.
      #
      # The mechanism here is a reply: any refusal — "stop", "remove me",
      # "not interested, don't email again" — is treated as immediate and
      # permanent, so it is a real mechanism rather than a gesture.
      #
      # postal_address is empty on purpose and nothing will send until you
      # fill it in. A placeholder would go out as a fake address in real
      # mail, which is worse than not sending.
      footer:
        enabled: true
        opt_out_line: "Reply \"stop\" and I won't contact you again."
        postal_address: ""
  linkedin:
    enabled: false       # automating LinkedIn violates their ToS — see README
    max_daily_connections: 20
    max_daily_messages: 10

# ── The model ─────────────────────────────────────────────────────────
# What does the thinking. The default is the Claude Code CLI already on your
# machine: no API key, no second bill.
#
# The other providers are for the cases that cannot serve — a server with no
# interactive login, a team that already buys OpenAI credit, a jurisdiction
# where DeepSeek is the practical choice. Everything downstream talks to the
# Brain, never to a provider, so this is genuinely a one-line change.
#
#   claude_cli         (default) headless `claude -p`. Needs `claude login`.
#   openai             needs OPENAI_API_KEY in .env
#   deepseek           needs DEEPSEEK_API_KEY in .env
#   openai_compatible  anything speaking the same API — vLLM, OpenRouter,
#                      Ollama. Set base_url and MODEL_API_KEY.
model:
  provider: "claude_cli"
  name: ""                 # blank = the provider's default model
  base_url: ""             # openai_compatible only
  temperature: 0.3
  max_tokens: 4096
  daily_call_budget: 200   # calls/day at 100%; usage.max_daily_claude_percent scales it

# ── Reading web pages ─────────────────────────────────────────────────
# Three tiers, cheapest first. "auto" uses the best one installed and only
# escalates when the page comes back blocked or empty.
#
#   basic        httpx + BeautifulSoup. Always available.
#   crawl4ai     renders JavaScript, returns Markdown — the model reads a
#                document instead of de-tagged soup.
#                pip install "openvz-leads[crawl]"
#   browser_use  an agent driving a real browser, for consent walls and
#                pages that only exist behind a click. Slow, and needs an
#                API key of its own (it cannot drive the Claude CLI).
#                pip install "openvz-leads[browser]"
crawl:
  provider: "auto"
  browser_fallback: false  # allow the browser tier when the others come back empty
  max_chars: 6000
  timeout_seconds: 30
  delay_seconds: 1.0

# ── CRM sync ──────────────────────────────────────────────────────────
# OpenVZ Leads owns the pipeline up to the reply. Meeting, won and lost
# belong wherever your customers already live, so each stage change can be
# pushed there instead of being retyped.
#
#   none     record stage changes locally only (default)
#   webhook  POST each change to webhook_url — works with OPENVZ CRM,
#            Zapier, n8n, or anything that accepts JSON
#   file     append JSON lines to data/crm-sync.jsonl for a later import
#
# The payload shape is documented in openvz_leads/integrations/crm.py and is
# stable. A bearer token goes in .env as CRM_WEBHOOK_TOKEN, not here.
crm:
  provider: "none"
  webhook_url: ""
  # Trim this if you like, but keep opted_out: it is the one stage where
  # the CRM not knowing eventually means someone emails them anyway.
  sync_stages: ["contacted", "replied", "meeting", "won", "lost", "opted_out"]
  timeout_seconds: 15

usage:
  max_daily_claude_percent: 80
  heartbeat_interval_minutes: 15
  quiet_hours:
    start: "22:00"
    end: "07:00"
    timezone: "America/New_York"
