[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openvz_leads"
version = "1.0.0"
description = "Autonomous AI sales agent. Find them. Understand them. Reach them."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["sales", "ai-agent", "cold-email", "prospecting", "autonomous-agent", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
# Keep in sync with requirements.txt (used by Docker builds).
dependencies = [
    "pyyaml>=6.0.1,<7",
    "python-dotenv>=1.0.1,<2",
    "httpx>=0.27.0,<1",
    "playwright>=1.40,<2",
    "beautifulsoup4>=4.12.3,<5",
    "dnspython>=2.4.2,<3",
    "aiosmtplib>=3.0.1,<4",
    "aiosqlite>=0.19,<1",
    "pydantic>=2.5,<3",
    "pytz>=2024.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
]
# Better page reading. Both are genuinely optional: with neither installed
# the crawler falls back to httpx + BeautifulSoup, which is what it did
# before these existed. They are out of the base install because between them
# they pull a browser and a few hundred MB, and most company sites are still
# HTML that does not need either.
crawl = [
    # Renders JavaScript and returns Markdown, so the model reads a document
    # rather than de-tagged soup.
    "crawl4ai>=0.4,<1",
]
browser = [
    # An agent driving a real browser, for consent walls and pages that only
    # exist behind a click. Needs its own API key — it cannot drive the
    # Claude Code CLI.
    "browser-use>=0.1,<1",
]

[project.urls]
Homepage = "https://github.com/mrlin728/openvz-leads"
Issues = "https://github.com/mrlin728/openvz-leads/issues"

[project.scripts]
openvz-leads = "openvz_leads.cli:main"

[tool.setuptools.packages.find]
include = ["openvz_leads*"]
